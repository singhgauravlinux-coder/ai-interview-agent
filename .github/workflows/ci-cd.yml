name: CI, build images, and update deployment manifests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
        working-directory: backend
      - name: Compile backend
        run: python -m compileall -q app migrations
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/web/package.json
      - name: Install web dependencies
        run: npm install
        working-directory: frontend/web
      - name: Type-check
        run: npm run lint
        working-directory: frontend/web
      - name: Production build
        run: npm run build
        working-directory: frontend/web

  publish-and-update-manifests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, web-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/$OWNER/$REPO-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$OWNER/$REPO-web" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API (SHA + latest)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.api }}:latest
      - name: Build and push web (SHA + latest)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/web
          push: true
          build-args: NEXT_PUBLIC_API_URL=/api/v1
          tags: |
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web }}:latest
      - name: Update Kubernetes image tags in Git
        env:
          API_IMAGE: ${{ steps.meta.outputs.api }}
          WEB_IMAGE: ${{ steps.meta.outputs.web }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import os, yaml
          mappings = {
              "infra/kubernetes/base/kustomization.yaml": {
                  "ghcr.io/OWNER/REPOSITORY-api": os.environ["API_IMAGE"],
                  "ghcr.io/OWNER/REPOSITORY-web": os.environ["WEB_IMAGE"],
              },
              "infra/kubernetes/migration/kustomization.yaml": {
                  "ghcr.io/OWNER/REPOSITORY-api": os.environ["API_IMAGE"],
              },
          }
          for path, images in mappings.items():
              with open(path, encoding="utf-8") as f:
                  doc = yaml.safe_load(f)
              for image in doc.get("images", []):
                  if image["name"] in images:
                      image["newName"] = images[image["name"]]
                      image["newTag"] = os.environ["IMAGE_TAG"]
              with open(path, "w", encoding="utf-8") as f:
                  yaml.safe_dump(doc, f, sort_keys=False)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/kubernetes/base/kustomization.yaml
          git commit -m "chore(deploy): pin images to ${IMAGE_TAG} [skip ci]" || true
          git push
