name: CI and publish images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-cd.yml"
      - "backend/**"
      - "frontend/**"
      - "infra/kubernetes/base/database.yaml"
      - "infra/kubernetes/migration/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci-cd.yml"
      - "backend/**"
      - "frontend/**"
      - "infra/kubernetes/base/database.yaml"
      - "infra/kubernetes/migration/**"

permissions:
  contents: write
  packages: write

# Prevent two workflow runs for main from racing to update image tags.
concurrency:
  group: ai-interview-agent-main
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app migrations

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m pytest -q

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install frontend dependencies
        working-directory: frontend/web
        run: npm install

      - name: Lint frontend
        working-directory: frontend/web
        run: npm run lint

      - name: Build frontend
        working-directory: frontend/web
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

  publish-and-update:
    name: Build, publish, and update Kubernetes image tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-tests
      - frontend-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image names
        id: images
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/${OWNER}/${REPO}-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${OWNER}/${REPO}-web" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.images.outputs.api }}:${{ steps.images.outputs.tag }}
            ${{ steps.images.outputs.api }}:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          tags: |
            ${{ steps.images.outputs.web }}:${{ steps.images.outputs.tag }}
            ${{ steps.images.outputs.web }}:latest

      - name: Update Kustomize image tags and push safely
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          update_manifests() {
            python - <<'PY'
          import os
          import yaml

          files = {
              "infra/kubernetes/base/kustomization.yaml": {
                  "api": os.environ["API_IMAGE"],
                  "web": os.environ["WEB_IMAGE"],
              },
              "infra/kubernetes/migration/kustomization.yaml": {
                  "api": os.environ["API_IMAGE"],
              },
          }

          for path, replacements in files.items():
              with open(path, encoding="utf-8") as stream:
                  document = yaml.safe_load(stream) or {}

              for image in document.get("images", []):
                  original = image.get("name", "")
                  if original.endswith("-api") or original.endswith("REPOSITORY-api"):
                      image["newName"] = replacements["api"]
                      image["newTag"] = os.environ["IMAGE_TAG"]
                  elif (
                      "web" in replacements
                      and (original.endswith("-web") or original.endswith("REPOSITORY-web"))
                  ):
                      image["newName"] = replacements["web"]
                      image["newTag"] = os.environ["IMAGE_TAG"]

              with open(path, "w", encoding="utf-8") as stream:
                  yaml.safe_dump(document, stream, sort_keys=False)
          PY
          }

          python -m pip install --quiet PyYAML

          # Retry if another GitHub user or process updates main between fetch and push.
          for attempt in 1 2 3 4 5; do
            echo "Manifest push attempt ${attempt}/5"

            git fetch origin main
            git rebase origin/main

            update_manifests

            git add infra/kubernetes/base/kustomization.yaml
            git add infra/kubernetes/migration/kustomization.yaml

            if git diff --cached --quiet; then
              echo "No image tag changes to commit."
              exit 0
            fi

            git commit -m "chore(deploy): pin images to ${IMAGE_TAG} [skip ci]"

            if git push origin HEAD:main; then
              echo "Kubernetes image tags pushed successfully."
              exit 0
            fi

            echo "Push rejected because origin/main moved. Rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep "$attempt"
          done

          echo "Could not push manifest changes after 5 attempts."
          exit 1
