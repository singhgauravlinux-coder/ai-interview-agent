apiVersion: v1
kind: Service
metadata:
  name: interview-redis
  namespace: ai-interview-agent
spec:
  selector:
    app: interview-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-redis
  namespace: ai-interview-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interview-redis
  template:
    metadata:
      labels:
        app: interview-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: interview-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: interview-redis-data
  namespace: ai-interview-agent
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
