apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interview-ingress
  namespace: ai-interview-agent
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [interview.example.com]
      secretName: interview-tls
  rules:
    - host: interview.example.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend: { service: { name: interview-api, port: { number: 8000 } } }
          - path: /health
            pathType: Exact
            backend: { service: { name: interview-api, port: { number: 8000 } } }
          - path: /ready
            pathType: Exact
            backend: { service: { name: interview-api, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: interview-web, port: { number: 3000 } } }
