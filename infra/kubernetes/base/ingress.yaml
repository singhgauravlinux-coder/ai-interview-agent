apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interview-ingress
  namespace: ai-interview-agent
  annotations:
    # Traefik's standard websecure entrypoint (HTTPS).
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - interview.local
      secretName: interview-tls
  rules:
    - host: interview.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: interview-api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: interview-api
                port:
                  number: 8000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: interview-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: interview-web
                port:
                  number: 3000
