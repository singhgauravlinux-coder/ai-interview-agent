apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-api
  namespace: ai-interview-agent
spec:
  replicas: 2
  selector:
    matchLabels: { app: interview-api }
  template:
    metadata:
      labels: { app: interview-api }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/OWNER/REPOSITORY-api:latest
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: interview-config }
            - secretRef: { name: interview-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: interview-secrets, key: DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: interview-api
  namespace: ai-interview-agent
spec:
  selector: { app: interview-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
