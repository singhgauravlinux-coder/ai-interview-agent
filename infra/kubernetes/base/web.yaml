apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-web
  namespace: ai-interview-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interview-web
  template:
    metadata:
      labels:
        app: interview-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/OWNER/REPOSITORY-web:latest
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: interview-web
  namespace: ai-interview-agent
spec:
  selector:
    app: interview-web
  ports:
    - name: http
      port: 3000
      targetPort: http
