apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: interview-api
  namespace: ai-interview-agent
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: interview-api }
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
